<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>No internet · Little Mandala</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #ffffff;
        color: #242b3b;
        font-family: 'Nunito', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      main { display: flex; flex-direction: column; align-items: center; gap: 20px; max-width: 420px; }
      h1 { margin: 0; font-size: 32px; font-weight: 900; }
      p { margin: 0; font-size: 18px; line-height: 1.6; color: #575e6c; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 64px;
        padding: 0 32px;
        border-radius: 999px;
        background: #096acb;
        color: #ffffff;
        font-size: 20px;
        font-weight: 900;
        text-decoration: none;
      }
      a:focus-visible { outline: 4px solid #242b3b; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">
        <g fill="#cfe3fb" stroke="#242b3b" stroke-width="3">
          <circle cx="48" cy="20" r="14" /><circle cx="76" cy="48" r="14" />
          <circle cx="48" cy="76" r="14" /><circle cx="20" cy="48" r="14" />
        </g>
        <circle cx="48" cy="48" r="14" fill="#fcd936" stroke="#242b3b" stroke-width="3" />
      </svg>
      <h1>No internet right now</h1>
      <p>Coloring still works. The grown-ups area needs the internet, so try it again when you're back online.</p>
      <a href="/">Back to coloring</a>
    </main>
  </body>
</html>
