<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>欢迎来到漫涂涂</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f1f3f8;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f1f3f8;">
      使用邮件中的链接或验证码确认邮箱，即可创建家长账号。两者都只能使用一次，1 小时后失效。
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f3f8;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background-color:#ffffff;border:1px solid #e0e3ea;border-radius:24px;">
            <tr>
              <td align="center" style="padding:40px 32px 8px 32px;">
                <img src="{{ .SiteURL }}/apple-icon.png" width="64" height="64" alt="漫涂涂" style="display:block;border:0;border-radius:16px;" />
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:20px 32px 0 32px;font-family:'Nunito','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                <h1 style="margin:0;font-size:26px;line-height:1.25;font-weight:900;color:#242b3b;">欢迎来到漫涂涂</h1>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:12px 32px 0 32px;font-family:'Nunito','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                <p style="margin:0;font-size:16px;line-height:1.6;color:#575e6c;">
                  确认你的邮箱即可创建家长账号，无需密码。
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:28px 32px 0 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center" bgcolor="#096acb" style="border-radius:999px;">
                      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" target="_blank" style="display:inline-block;padding:15px 36px;font-family:'Nunito','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1;font-weight:800;color:#ffffff;text-decoration:none;border-radius:999px;">确认并登录</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:16px 32px 0 32px;font-family:'Nunito','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                <p style="margin:0;font-size:14px;line-height:1.6;color:#575e6c;">
                  链接和验证码只能使用一次，1 小时后失效。<br />重新获取后，这一组将作废。
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:28px 32px 0 32px;font-family:'Nunito','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                <p style="margin:0;font-size:14px;line-height:1.6;color:#575e6c;">
                  要在另一台设备（比如孩子的平板）上登录？<br />请在那台设备上输入这个验证码：
                </p>
                <p style="margin:10px 0 0 0;font-family:Menlo,Consolas,'Courier New',monospace;font-size:32px;line-height:1.2;font-weight:700;letter-spacing:6px;color:#242b3b;">{{ .Token }}</p>
                <p style="margin:10px 0 0 0;font-size:13px;line-height:1.6;color:#575e6c;">
                  请勿把验证码告诉任何人。我们绝不会向你索要。
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:32px 32px 0 32px;">
                <div style="border-top:1px solid #e0e3ea;line-height:0;font-size:0;">&nbsp;</div>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 36px 32px;font-family:'Nunito','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                <p style="margin:0;font-size:14px;line-height:1.6;color:#575e6c;">
                  没有注册过？忽略这封邮件即可。只有使用这个链接或验证码，才会创建账号。
                </p>
              </td>
            </tr>
          </table>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
            <tr>
              <td align="center" style="padding:20px 32px 0 32px;font-family:'Nunito','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                <p style="margin:0;font-size:13px;line-height:1.6;color:#575e6c;">
                  漫涂涂 &middot; 给孩子的宁静花朵曼陀罗涂色<br />
                  <a href="{{ .SiteURL }}" style="color:#096acb;text-decoration:none;">mandala.smartmango.ai</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
